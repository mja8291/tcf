<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Offline — TCF MQI Survey</title>
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: #f1f4ee;
    color: #1b241d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    text-align: center;
  }
  img { width: 56px; height: 56px; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0 0 8px; color: #123d24; }
  p { font-size: 14px; color: #4b5c50; max-width: 320px; line-height: 1.5; margin: 0 0 20px; }
  .actions { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
  button, a.button {
    appearance: none; border: none; border-radius: 12px; padding: 13px 22px;
    font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
    display: inline-block; box-sizing: border-box;
  }
  button { background: #0e5c4d; color: #fff; }
  a.button { background: #fff; color: #123d24; border: 1px solid #d7ddd3; }
</style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="" />
  <h1>You're offline</h1>
  <p>
    This exact page couldn't load with no connection right now. Any survey already open in another tab keeps working
    and saving as normal — this doesn't affect it. Home is always available offline, including your saved drafts.
  </p>
  <div class="actions">
    <button onclick="location.reload()">Try again</button>
    <a class="button" href="/">Go to Home</a>
  </div>
</body>
</html>
